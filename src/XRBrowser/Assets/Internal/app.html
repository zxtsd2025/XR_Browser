<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>XR Browser</title>
  <link rel="stylesheet" href="styles.css" />
  <script>
    (function () {
      try {
        document.documentElement.dataset.theme = window.__XR_INITIAL_THEME__ === 'dark' ? 'dark' : 'light';
      } catch (_) { document.documentElement.dataset.theme = 'light'; }
    })();
  </script>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <a class="sidebar-brand" href="#settings">
        <span class="brand-mark">XR</span>
        <span class="brand-text">XR Browser<span>CHROMIUM BROWSER</span></span>
      </a>
      <nav class="side-nav" id="sideNav">
        <a class="side-link" href="#settings" data-page="settings">
          <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 .6 1.7 1.7 0 0 0-.4 1.1V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 8.6 19.4a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-.6-1 1.7 1.7 0 0 0-1.1-.4H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.6 8.6a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-.6 1.7 1.7 0 0 0 .4-1.1V3a2 2 0 1 1 4 0v.09A1.7 1.7 0 0 0 15.4 4.6a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9c.14.37.35.7.6 1 .3.3.7.44 1.1.44H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51.56Z"/></svg>
          设置
        </a>
        <a class="side-link" href="#history" data-page="history">
          <svg class="icon" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5"/><path d="M12 7v5l3 2"/></svg>
          历史记录
        </a>
        <a class="side-link" href="#bookmarks" data-page="bookmarks">
          <svg class="icon" viewBox="0 0 24 24"><path d="M6 4.5A1.5 1.5 0 0 1 7.5 3h9A1.5 1.5 0 0 1 18 4.5V21l-6-4-6 4V4.5Z"/></svg>
          书签
        </a>
        <a class="side-link" href="#downloads" data-page="downloads">
          <svg class="icon" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M4 19h16"/></svg>
          下载内容
        </a>
        <a class="side-link" href="#extensions" data-page="extensions">
          <svg class="icon" viewBox="0 0 24 24"><path d="M9 3h6v3a2.5 2.5 0 0 0 5 0h1v6h-3a2.5 2.5 0 0 0 0 5v4H9v-3a2.5 2.5 0 0 0-5 0H3V9h3a2.5 2.5 0 0 0 0-5H3V3h6Z"/></svg>
          扩展程序
        </a>
        <a class="side-link" href="#about" data-page="about">
          <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.2"/></svg>
          关于
        </a>
      </nav>
      <div class="sidebar-bottom">
        XR Browser <span id="sideVersion"></span><br />
        Chromium 内核 · 本地数据
      </div>
    </aside>
    <main class="main">
      <div class="main-inner" id="content">
        <div class="page-kicker">XR Browser</div>
        <div class="skeleton" style="width:180px;height:28px;margin:10px 0 24px"></div>
        <div class="skeleton" style="width:100%;height:72px;margin-bottom:12px"></div>
        <div class="skeleton" style="width:100%;height:72px"></div>
      </div>
    </main>
  </div>

  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal" id="modalBox"></div>
  </div>
  <div class="toast" id="toast"></div>

  <script src="app.js"></script>
</body>
</html>
